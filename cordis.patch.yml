# dsh-profiler — bundle patch
- insert:
    - id: dsh-profiler
      name: dsh-profiler
      config:
        enabled: true
        sampleLimit: 800
        slowToolMs: 3000
        sessionScanTtlMs: 60000
        http: true
        rewind: true
        rewindMaxEntries: 2000
        rewindMaxFileKb: 512
